# Agent Synchronization Configuration for Aquit-Platform
# Manages: genspark, google, vibe/mistral, supabase, and all AI agents
# Last Updated: 2026-08-30

version = "1.0.0"
description = "Agent synchronization configuration for Aquit-Platform"

[agents.vibe]
type = "mistral"
config_path = "~/.vibe/config.toml"
status = "active"

[agents.vibe.skills.project_skills.supabase]
name = "supabase"
path = ".agents/skills/supabase/SKILL.md"
source = "supabase/agent-skills"
enabled = true

[agents.vibe.skills.project_skills.supabase_postgres]
name = "supabase-postgres-best-practices"
path = ".agents/skills/supabase-postgres-best-practices/SKILL.md"
source = "supabase/agent-skills"
enabled = true

[agents.vibe.skills.project_skills.workflow_init]
name = "workflow-init"
path = ".agents/skills/workflow-init/SKILL.md"
source = "vercel/workflow"
enabled = true

[[agents.vibe.skills.mcp_servers]]
name = "stitch"
type = "http"
url = "https://stitch.googleapis.com/mcp"
description = "Google services via MCP"
enabled = true

[agents.vibe.tools.bash]
allowlist = [
    "/home/andrew/.config/Code/*",
    "/home/andrew/.vibe/*",
    "/home/andrew/Development/Tools/AI/Engines/computer-use-agent/cua2-core/*"
]
commands = ["git", "ls", "find", "grep", "cat", "echo", "python3"]

[agents.genspark]
type = "genspark"
cli_config = "~/.genspark-tool-cli/config.json"
status = "active"
api_key = "gsk-eyJjb2dlbl9pZCI6ImEyYTMxN2VmLWMzMGEtNGMzZC1hMTMwLWRhODhhZjc1MTUwMi..."
base_url = "https://www.genspark.ai"
git_branch = "genspark_ai_developer"

[agents.genspark.vscode_extension]
id = "genspark.genspark-1.0.0"
version = "1.0.0"
enabled = true

[agents.google]
type = "google"
status = "active"

[[agents.google.services]]
name = "stitch_api"
type = "mcp"
url = "https://stitch.googleapis.com/mcp"
api_key = "AQ.Ab8RN6L96CR5ey_d6FEMkeq44nwMzMEKVzlli3KkNmxO-p9CEw"
enabled = true

[[agents.google.chrome_extensions]]
name = "genspark"
extension_id = "hmdkfngkncmbgiehonfebecighedjiak"
version = "1.1.23"
enabled = true

[agents.supabase]
type = "supabase"
config_path = "supabase/config.toml"
status = "active"
project_id = "Aquit-Platform"

[agents.supabase.components.api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[agents.supabase.components.db]
enabled = true
port = 54322
major_version = 17

[agents.supabase.components.studio]
enabled = true
port = 54323

[agents.supabase.components.realtime]
enabled = true

[agents.supabase.components.storage]
enabled = true

[agents.supabase.components.auth]
enabled = true

[sync_settings]
auto_sync = true
sync_interval = "5m"
conflict_resolution = "manual"
backup_enabled = true
backup_path = ".agents/backups/"

[sync_settings.notifications]
email = false
desktop = true
log_file = ".agents/logs/sync.log"

[[skills_registry.sources]]
name = "supabase/agent-skills"
type = "github"
skills = ["supabase", "supabase-postgres-best-practices"]

[[skills_registry.sources]]
name = "vercel/workflow"
type = "github"
skills = ["workflow-init"]

[directories]
agents_root = ".agents/"
project_agents = "agent/"
outputs = ".agents/outputs/"
skills = ".agents/skills/"
cua = ".agents/cua/"
cue = ".agents/cue/"

[metadata]
created_by = "andrew"
repository = "Aquit-Platform"
total_skills = 3
total_mcp_servers = 1
total_extensions = 2

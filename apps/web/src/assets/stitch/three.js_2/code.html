<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_78 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_78" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_78');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.querySelector('#carousel-container');
const radius = 550;
const members = [
    { id: '1', name: 'The Docket', role: 'Case Management', department: 'ACTIVE MATTERS', avatar: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=200&h=200', bio: 'The master list of all active and closed court matters.' },
    { id: '2', name: 'Chambers', role: 'AI Legal Team', department: 'INNER SANCTUM', avatar: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Collaborate with your AI legal force in the conference room.' },
    { id: '3', name: 'Law Library', role: 'Legal Research', department: 'THE STACKS', avatar: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Search global authorities, statutes, and citation webs.' },
    { id: '4', name: 'Record Room', role: 'Document Control', department: 'FILING CABINET', avatar: 'https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Official filing center for exhibits, motions, and transcripts.' },
    { id: '5', name: 'Investigations', role: 'Evidence Analysis', department: 'WAR ROOM', avatar: 'https://images.unsplash.com/photo-1453728013993-6d66e9c9123a?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Link evidence to the timeline and spot critical issues.' },
    { id: '6', name: 'Case Timeline', role: 'Chronology', department: 'EVENT LOG', avatar: 'https://images.unsplash.com/photo-1506784919141-93504332279b?auto=format&fit=crop&q=80&w=200&h=200', bio: 'A chronological record of every legal event in the matter.' },
    { id: '7', name: 'Court Watch', role: 'Docket Sync', department: 'THE CLERK', avatar: 'https://images.unsplash.com/photo-1449156059431-789955417bb8?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Real-time monitoring of court activity and hearing prep.' },
    { id: '8', name: 'Directory', role: 'Counsel Search', department: 'BAR LISTINGS', avatar: 'https://images.unsplash.com/photo-1436450412740-6b988f486c6b?auto=format&fit=crop&q=80&w=200&h=200', bio: 'Find and verify counsel or browse pro bono services.' }
];

let rotationAngle = 0;
let selectedIndex = 0;
const count = members.length;
const angleStep = 360 / count;

function createCarousel() {
    const ring = document.createElement('div');
    ring.className = 'relative w-full h-full transition-transform duration-700 ease-out';
    ring.style.transformStyle = 'preserve-3d';
    ring.style.transform = `translateZ(-${radius}px) rotateY(0deg)`;
    
    members.forEach((member, index) => {
        const itemAngle = index * angleStep;
        const card = document.createElement('div');
        card.className = 'absolute left-1/2 top-1/2 -ml-[150px] -mt-[200px] w-[300px] h-[400px] cursor-pointer hover:brightness-125 transition-all duration-300';
        card.style.transformStyle = 'preserve-3d';
        card.style.transform = `rotateY(${itemAngle}deg) translateZ(${radius}px)`;
        
        card.innerHTML = `
            <div class="w-full h-full rounded-2xl bg-[#1c1b1b] border border-[#3a3939] p-6 flex flex-col justify-between shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                <span class="px-2.5 py-1 text-[10px] font-bold rounded-md bg-[#3a3939] text-[#e0e0e0] w-fit uppercase tracking-widest">
                    ${member.department}
                </span>
                <div class="flex flex-col items-center text-center my-auto">
                    <img src="${member.avatar}" alt="${member.name}" class="w-24 h-24 rounded-full object-cover border-2 border-[#3a3939] shadow-lg mb-4 grayscale hover:grayscale-0 transition-all duration-500">
                    <h3 class="text-xl font-serif text-white mb-1 font-bold">${member.name}</h3>
                    <p class="text-xs text-[#b0b0b0] uppercase tracking-tighter mb-3">${member.role}</p>
                    <p class="text-sm text-[#808080] line-clamp-3 px-2 font-serif italic">${member.bio}</p>
                </div>
                <div class="pt-4 border-t border-[#3a3939] flex items-center justify-between">
                    <div class="flex gap-3 text-[#b0b0b0]">
                        <svg class="w-4 h-4 hover:text-white transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                        <svg class="w-4 h-4 hover:text-white transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <button class="px-4 py-1.5 rounded-sm bg-white text-black text-[10px] font-bold uppercase hover:bg-opacity-90 transition-all">
                        Access Module
                    </button>
                </div>
            </div>
        `;
        
        card.addEventListener('click', () => {
            selectedIndex = index;
            updateRotation();
        });
        
        ring.appendChild(card);
    });
    
    container.appendChild(ring);
    window.ring = ring;
    updateCards();
}

function updateRotation() {
    rotationAngle = -selectedIndex * angleStep;
    window.ring.style.transform = `translateZ(-${radius}px) rotateY(${rotationAngle}deg)`;
    updateCards();
    document.querySelector('#index-display').textContent = `${selectedIndex + 1} / ${count}`;
}

function updateCards() {
    const cards = window.ring.children;
    for(let i=0; i<cards.length; i++) {
        const itemAngle = i * angleStep;
        let diff = (itemAngle + rotationAngle) % 360;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        
        const absDiff = Math.abs(diff);
        const opacity = Math.max(0.1, 1 - absDiff / 120);
        const scale = Math.max(0.6, 1 - absDiff / 300);
        
        cards[i].style.opacity = opacity;
        cards[i].style.filter = `blur(${absDiff / 20}px)`;
        cards[i].style.zIndex = Math.round(100 - absDiff);
    }
}

document.querySelector('#prev-btn').addEventListener('click', () => {
    selectedIndex = (selectedIndex - 1 + count) % count;
    updateRotation();
});

document.querySelector('#next-btn').addEventListener('click', () => {
    selectedIndex = (selectedIndex + 1) % count;
    updateRotation();
});

createCarousel();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_78 -->
</body>
</html>

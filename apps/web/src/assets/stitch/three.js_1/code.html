```tsx
'use client';

import React, { useState } from 'react';
import Link from 'next/link';
import Image from 'next/image';
import { ChevronLeft, ChevronRight, ExternalLink, ArrowRight } from 'lucide-react';

export interface ModuleNavCard {
  id: string;
  name: string;
  role: string;
  department: string;
  avatar: string;
  bio: string;
  href: string;
}

const MODULES: ModuleNavCard[] = [
  {
    id: '1',
    name: 'The Docket',
    role: 'Case Management',
    department: 'ACTIVE MATTERS',
    avatar: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=300&h=300',

  },
  {
    id: '2',
    name: 'Chambers',
    role: 'AI Legal Team',
    department: 'INNER SANCTUM',
    avatar: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Collaborate with your specialized AI legal force in the conference room.',
    href: '/chambers',
  },
  {
    id: '3',
    name: 'Law Library',
    role: 'Legal Research',
    department: 'THE STACKS',
    avatar: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Query global authorities, primary statutes, and citation webs with AI synthesis.',
    href: '/law-library',
  },
  {
    id: '4',
    name: 'Record Room',
    role: 'Document Control',
    department: 'FILING CABINET',
    avatar: 'https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Official court filing center for charging instruments, exhibits, and motions.',
    href: '/record-room',
  },
  {
    id: '5',
    name: 'Investigations',
    role: 'Evidence Analysis',
    department: 'WAR ROOM',
    avatar: 'https://images.unsplash.com/photo-1453728013993-6d66e9c9123a?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Link evidence to chronological facts, inspect affidavits, and spot conflicts.',
    href: '/investigations',
  },
  {
    id: '6',
    name: 'Case Timeline',
    role: 'Chronology',
    department: 'EVENT LOG',
    avatar: 'https://images.unsplash.com/photo-1506784919141-93504332279b?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'An immutable timeline tracking arrests, discovery handoffs, and hearings.',
    href: '/timeline',
  },
  {
    id: '7',
    name: 'Court Watch',
    role: 'Docket Sync',
    department: 'THE CLERK',
    avatar: 'https://images.unsplash.com/photo-1449156059431-789955417bb8?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Real-time telemetry and schedule tracking with live court filing alerts.',
    href: '/court-watch',
  },
  {
    id: '8',
    name: 'Counsel Directory',
    role: 'Counsel Search',
    department: 'BAR LISTINGS',
    avatar: 'https://images.unsplash.com/photo-1436450412740-6b988f486c6b?auto=format&fit=crop&q=80&w=300&h=300',
    bio: 'Verify counsel credentials, detect conflicts, or explore pro bono programs.',
    href: '/directory',
  },
];

interface Cylindrical3DCarouselProps {
  radius?: number;
}

export default function Cylindrical3DCarousel({ radius = 560 }: Cylindrical3DCarouselProps) {
  const [selectedIndex, setSelectedIndex] = useState(0);
  const count = MODULES.length;
  const angleStep = 360 / count;
  const rotationAngle = -selectedIndex * angleStep;

  const handlePrev = () => {
    setSelectedIndex((prev) => (prev - 1 + count) % count);
  };

  const handleNext = () => {
    setSelectedIndex((prev) => (prev + 1) % count);
  };

  return (
    <div className="relative w-full h-[calc(100vh-3.5rem)] flex flex-col items-center justify-center overflow-hidden bg-[#141313]">
      {/* 3D Perspective Viewport */}
      <div
        className="relative w-full h-[520px] flex items-center justify-center"
        style={{ perspective: '1200px' }}
      >
        <div
          className="relative w-full h-full flex items-center justify-center transition-transform duration-700 ease-out"
          style={{
            transformStyle: 'preserve-3d',
            transform: `translateZ(-${radius}px) rotateY(${rotationAngle}deg)`,
          }}
        >
          {MODULES.map((item, index) => {
            const itemAngle = index * angleStep;
            let rawDiff = (itemAngle + rotationAngle) % 360;
            if (rawDiff > 180) rawDiff -= 360;
            if (rawDiff < -180) rawDiff += 360;
            const absDiff = Math.abs(rawDiff);
            const isCenter = absDiff < angleStep / 2;
            const opacity = Math.max(0.12, 1 - absDiff / 130);
            const scale = Math.max(0.65, 1 - absDiff / 360);

            return (
              <div
                key={item.id}
                onClick={() => setSelectedIndex(index)}
                className="absolute w-[320px] h-[440px] cursor-pointer transition-all duration-300"
                style={{
                  transformStyle: 'preserve-3d',
                  transform: `rotateY(${itemAngle}deg) translateZ(${radius}px) scale(${scale})`,
                  opacity,
                  filter: `blur(${absDiff / 24}px)`,
                  zIndex: isCenter ? 60 : Math.round(100 - absDiff),
                }}
              >
                <div
                  className={`w-full h-full rounded-2xl p-6 flex flex-col justify-between border transition-all duration-300 shadow-[0_20px_50px_rgba(0,0,0,0.7)] ${
                    isCenter
                      ? 'bg-[#1c1b1b] border-[#c8a97e] ring-1 ring-[#c8a97e]/40'
                      : 'bg-[#181818] border-[#3a3939]'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="px-2.5 py-1 text-[10px] font-mono font-bold tracking-widest rounded bg-[#2a2929] text-[#c8a97e] uppercase">
                      {item.department}
                    </span>
                    <span className="text-[10px] font-mono text-[#777]">
                      MOD #{item.id}
                    </span>
                  </div>

                  <div className="flex flex-col items-center text-center my-auto">
                    <div className="relative w-24 h-24 rounded-full overflow-hidden border-2 border-[#3a3939] mb-4 shadow-lg">
                      <Image
                        src={item.avatar}
                        alt={item.name}
                        fill
                        className="object-cover grayscale hover:grayscale-0 transition-all duration-500"
                      />
                    </div>
                    <h3 className="text-2xl font-serif font-bold text-white mb-1">
                      {item.name}
                    </h3>
                    <p className="text-xs font-mono uppercase tracking-wider text-[#c8a97e] mb-3">
                      {item.role}
                    </p>
                    <p className="text-xs text-[#a0a0a0] leading-relaxed line-clamp-3 font-serif italic">
                      {item.bio}
                    </p>
                  </div>

                  <div className="pt-4 border-t border-[#2a2929] flex items-center justify-between">
                    <span className="text-[10px] font-mono text-[#666]">
                      Acquit Core Engine
                    </span>
                    <Link
                      href={item.href}
                      onClick={(e) => e.stopPropagation()}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded bg-white hover:bg-[#e0e0e0] text-black text-[11px] font-bold uppercase tracking-wider transition-all shadow"
                    >
                      <span>Enter Module</span>
                      <ArrowRight className="w-3.5 h-3.5" />
                    </Link>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Navigation Controls */}
      <div className="flex items-center gap-6 mt-4 z-20">
        <button
          onClick={handlePrev}
          aria-label="Previous module"
          className="p-3 rounded-full bg-[#1c1b1b] border border-[#3a3939] text-white hover:bg-[#282727] hover:border-[#c8a97e] transition-all"
        >
          <ChevronLeft className="w-5 h-5" />
        </button>

        <div className="flex items-center gap-2 font-mono text-xs text-[#a0a0a0]">
          <span className="text-white font-bold">{selectedIndex + 1}</span>
          <span>/</span>
          <span>{count}</span>
        </div>

        <button
          onClick={handleNext}
          aria-label="Next module"
          className="p-3 rounded-full bg-[#1c1b1b] border border-[#3a3939] text-white hover:bg-[#282727] hover:border-[#c8a97e] transition-all"
        >
          <ChevronRight className="w-5 h-5" />
        </button>
      </div>
    </div>
  );
}

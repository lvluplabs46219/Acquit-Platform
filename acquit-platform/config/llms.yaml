providers:
  local_ollama:
    name: local_ollama
    model: thomboe/dolphin3.0-llama3.1-8b-abliterated:latest
    base_url: http://localhost:11434
    timeout: 120
    max_retries: 3
    capabilities:
      - text_generation
      - private_processing
      - case_data_processing
    cost_per_token: 0.0
    avg_latency: 0.3

fallback_chain:
  - local_ollama